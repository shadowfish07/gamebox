name: flutter_release_updater
description: Reusable GitHub Release APK updater for Android Flutter applications.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ">=3.0.3 <4.0.0"
  http: ">=1.2.0 <2.0.0"
  package_info_plus: ">=8.0.0 <9.0.0"
  path_provider: ">=2.1.2 <3.0.0"
  shared_preferences: ">=2.2.2 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.zqydev.flutter_release_updater
        pluginClass: FlutterReleaseUpdaterPlugin

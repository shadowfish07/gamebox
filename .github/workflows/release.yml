name: Release Android App

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to build, for example v1.0.2
        required: true
        type: string
      publish:
        description: Upload the tested assets to the existing version tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.1"
  JAVA_VERSION: "17"
  GODOT_VERSION: "4.7.0"
  GAMEBOX_API_BASE_URL: "https://gamebox.zqydev.me"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="${GITHUB_REF_NAME}"
          source_ref="${tag}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
            if [[ "${DISPATCH_PUBLISH}" != "true" ]]; then
              source_ref="${GITHUB_SHA}"
            else
              source_ref="${tag}"
            fi
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Verify tag matches pubspec version
        working-directory: app
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          pubspec_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "${pubspec_version}" != "${RELEASE_VERSION}" ]]; then
            echo "Tag version ${RELEASE_VERSION} does not match pubspec ${pubspec_version}" >&2
            exit 1
          fi

      - name: Run source tests
        run: |
          bash tool/verify_fast.sh
          (cd app/android && ./gradlew :app:testDebugUnitTest)

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > app/android/app/release-key.jks
          {
            echo "storeFile=release-key.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties

      - name: Build signed APK and app bundle
        working-directory: app
        env:
          GAMEBOX_REQUIRE_RELEASE_SIGNING: "true"
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          flutter build apk --release \
            --build-name="${RELEASE_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define="GAMEBOX_API_BASE_URL=${GAMEBOX_API_BASE_URL}"
          flutter build appbundle --release \
            --build-name="${RELEASE_VERSION}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define="GAMEBOX_API_BASE_URL=${GAMEBOX_API_BASE_URL}"
          bash ../tool/verify_release_godot_bridge.sh \
            build/app/outputs/mapping/release/mapping.txt

      - name: Verify and prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          apk="release-assets/gamebox-v${RELEASE_VERSION}-android.apk"
          bundle="release-assets/gamebox-v${RELEASE_VERSION}-android.aab"
          cp app/build/app/outputs/flutter-apk/app-release.apk "${apk}"
          cp app/build/app/outputs/bundle/release/app-release.aab "${bundle}"
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose --print-certs "${apk}"
          (cd release-assets && sha256sum "$(basename "${apk}")" "$(basename "${bundle}")" > checksums.txt)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test exact signed release APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Gamebox_Release_CI_API_35
          disk-size: 6000M
          disable-animations: true
          script: >-
            GAMEBOX_ANDROID_SERIAL=emulator-5554
            GAMEBOX_ALLOW_RENDERER_LIMITED_SMOKE=true
            bash tool/smoke_android_release_apk.sh
            "release-assets/gamebox-v${{ steps.release.outputs.version }}-android.apk"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          (cd release-assets && sha256sum --check checksums.txt)
          prerelease=()
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "Gamebox ${RELEASE_TAG}" \
              "${prerelease[@]}"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber

      - name: Remove signing material
        if: always()
        run: rm -f app/android/app/release-key.jks app/android/key.properties

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses
      - name: Pin Android build toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.0'
          use-dotnet: false
      - name: Install zsh for macOS deployment script checks
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh
      - name: Verify source and debug package
        run: bash tool/verify.sh

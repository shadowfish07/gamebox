name: Debug APK

on:
  push:
    paths:
      - 'app/**'
      - 'game_runtime/**'
      - 'tool/**'
      - '.github/workflows/debug.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'game_runtime/**'
      - 'tool/**'
      - '.github/workflows/debug.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL baked into this debug build
        required: false
        default: 'https://staging-gamebox.zqydev.me'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Keep rolling release writes serialized, while letting separate PRs build
  # independently and canceling stale builds for the same PR.
  group: ${{ github.event_name == 'pull_request' && format('debug-apk-pr-{0}', github.event.pull_request.number) || 'debug-apk-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.1"
  JAVA_VERSION: "17"
  GODOT_VERSION: "4.7.0"
  DEBUG_RELEASE_TAG: "debug-latest"
  DEBUG_API_BASE_URL: "https://staging-gamebox.zqydev.me"

jobs:
  build-and-publish:
    # Fork pull requests cannot access the stable debug-signing secrets. Do not
    # use pull_request_target to execute untrusted fork code with those secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Import Godot runtime assets
        run: godot --headless --path game_runtime --import

      - name: Configure stable debug signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > app/android/app/release-key.jks
          {
            echo "storeFile=release-key.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > app/android/key.properties

      - name: Build debug APK with independent package name
        working-directory: app
        env:
          GAMEBOX_DEBUG_ARTIFACT: "true"
          GAMEBOX_REQUIRE_RELEASE_SIGNING: "true"
          API_BASE_URL: ${{ inputs.api_base_url || env.DEBUG_API_BASE_URL }}
        run: |
          pubspec_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          short_sha="${GITHUB_SHA::7}"
          flutter build apk --debug \
            --build-name="${pubspec_version}-dev.${short_sha}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define="GAMEBOX_API_BASE_URL=${API_BASE_URL}"

      - name: Verify debug package name is independent
        run: |
          build_tools_dir="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -1)"
          aapt="${build_tools_dir}/aapt"
          package_line="$("${aapt}" dump badging app/build/app/outputs/flutter-apk/app-debug.apk | grep '^package:')"
          printf '%s\n' "${package_line}"
          if ! grep -q "name='me.zqydev.gamebox.debug'" <<<"${package_line}"; then
            printf 'Debug APK package name is not me.zqydev.gamebox.debug\n' >&2
            exit 1
          fi

      - name: Stage APK for release
        run: |
          mkdir -p debug-assets
          artifact_identity="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          asset_name="gamebox-debug-${artifact_identity}.apk"
          checksum_name="checksums-${artifact_identity}.txt"
          cp app/build/app/outputs/flutter-apk/app-debug.apk "debug-assets/${asset_name}"
          (cd debug-assets && sha256sum "${asset_name}" > "${checksum_name}")

      - name: Upload PR debug APK
        if: github.event_name == 'pull_request'
        id: upload-pr-debug-apk
        uses: actions/upload-artifact@v7
        with:
          name: gamebox-debug-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            debug-assets/*.apk
            debug-assets/checksums-*.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Show PR debug APK
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_SHA: ${{ github.sha }}
          ARTIFACT_NAME: gamebox-debug-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          ARTIFACT_URL: ${{ steps.upload-pr-debug-apk.outputs.artifact-url }}
        run: |
          marker='<!-- gamebox-pr-debug-apk -->'
          apk_sha256="$(cut -d ' ' -f 1 debug-assets/checksums-*.txt)"
          printf -v body "%s\n\n### Debug APK\n\n- [Download \`%s\`](%s)\n- PR head: \`%s\`\n- Tested merge: \`%s\`\n- APK SHA-256: \`%s\`\n- Retention: 14 days\n" \
            "${marker}" \
            "${ARTIFACT_NAME}" \
            "${ARTIFACT_URL}" \
            "${PR_HEAD_SHA}" \
            "${BUILD_SHA}" \
            "${apk_sha256}"

          printf '%s\n' "${body}" >> "${GITHUB_STEP_SUMMARY}"

          comment_id="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
              jq -r '.[][] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- gamebox-pr-debug-apk -->")) | .id' |
              tail -n 1
          )"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="${body}" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="${body}" >/dev/null
          fi

      - name: Publish rolling debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASE_URL: ${{ inputs.api_base_url || env.DEBUG_API_BASE_URL }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          artifact_identity="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pubspec_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)"
          asset_name="gamebox-debug-${artifact_identity}.apk"
          checksum_name="checksums-${artifact_identity}.txt"
          notes="Debug build from \`${GITHUB_SHA}\` (\`${GITHUB_REF_NAME}\`)

          - version: \`${pubspec_version}-dev.${short_sha}\`
          - run: \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)
          - package: \`me.zqydev.gamebox.debug\`
          - api: \`${API_BASE_URL}\`
          - apk: \`${asset_name}\`
          - checksums: \`${checksum_name}\`"

          if ! gh release view "${DEBUG_RELEASE_TAG}" >/dev/null 2>&1; then
            default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${DEBUG_RELEASE_TAG}" >/dev/null 2>&1; then
              gh release create "${DEBUG_RELEASE_TAG}" \
                --verify-tag \
                --prerelease \
                --title "Gamebox debug build" \
                --notes "${notes}"
            else
              gh release create "${DEBUG_RELEASE_TAG}" \
                --target "${default_branch}" \
                --prerelease \
                --title "Gamebox debug build" \
                --notes "${notes}"
            fi
          fi
          existing_assets="$(gh release view "${DEBUG_RELEASE_TAG}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          assets_to_upload=()
          for asset in "${asset_name}" "${checksum_name}"; do
            if ! grep -Fx -- "${asset}" <<<"${existing_assets}" >/dev/null; then
              assets_to_upload+=("debug-assets/${asset}")
            fi
          done
          if (( ${#assets_to_upload[@]} > 0 )); then
            gh release upload "${DEBUG_RELEASE_TAG}" "${assets_to_upload[@]}"
          fi
          # Keep the tag as the stable release identity. The immutable asset
          # names and notes identify the actual source branch and commit.
          gh release edit "${DEBUG_RELEASE_TAG}" --notes "${notes}"

      - name: Remove signing material
        if: always()
        run: rm -f app/android/app/release-key.jks app/android/key.properties

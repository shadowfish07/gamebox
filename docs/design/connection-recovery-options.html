<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamebox · 连接恢复交互方案</title>
  <style>
    :root {
      color-scheme: dark;
      --primary: #82d5c8;
      --on-primary: #003731;
      --primary-container: #005047;
      --on-primary-container: #9ef2e3;
      --secondary-container: #344b47;
      --on-secondary-container: #cce8e2;
      --surface: #0f1513;
      --surface-low: #151c1a;
      --surface-container: #1b2321;
      --surface-high: #252d2b;
      --surface-highest: #303936;
      --on-surface: #dce5e1;
      --on-surface-variant: #bec9c5;
      --outline: #89938f;
      --outline-variant: #3f4946;
      --error: #ffb4ab;
      --error-container: #93000a;
      --on-error-container: #ffdad6;
      --warning-container: #5b3a00;
      --on-warning-container: #ffddb4;
      --success-container: #124f3a;
      --on-success-container: #a3f1ca;
      --shadow: rgba(0, 0, 0, 0.38);
      --phone-width: min(390px, calc(100vw - 32px));
      font-family: Inter, "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--on-surface);
      background:
        radial-gradient(circle at 15% 8%, rgba(0, 107, 96, 0.32), transparent 28rem),
        linear-gradient(145deg, #09100e, #111916 50%, #0a1210);
    }

    button { font: inherit; }

    .prototype {
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(390px, 1fr);
      gap: clamp(32px, 6vw, 88px);
      min-height: 100vh;
      padding: 32px clamp(24px, 6vw, 96px);
      align-items: center;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--on-surface-variant);
      line-height: 1.65;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
      color: var(--on-surface-variant);
      font-size: 13px;
      font-weight: 700;
    }

    .option-list { display: grid; gap: 8px; }

    .option-input {
      position: absolute;
      width: 1px;
      height: 1px;
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }

    .option-card {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 12px;
      min-height: 68px;
      padding: 12px 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 18px;
      background: rgba(27, 35, 33, .78);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 100ms ease;
    }

    .option-card:hover { background: var(--surface-container); }
    .option-card:active { transform: scale(.985); }
    .option-input:focus-visible + .option-card { outline: 3px solid var(--primary); outline-offset: 2px; }
    .option-input:checked + .option-card {
      border-color: var(--primary);
      background: var(--primary-container);
    }

    .option-letter {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: var(--on-secondary-container);
      background: var(--secondary-container);
      font-weight: 850;
    }

    .option-card strong,
    .option-card small { display: block; }
    .option-card strong { margin-top: 1px; font-size: 14px; }
    .option-card small { margin-top: 4px; color: var(--on-surface-variant); line-height: 1.35; }
    .option-input:checked + .option-card small { color: var(--on-primary-container); }

    .recommended {
      align-self: start;
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--on-primary);
      background: var(--primary);
      font-size: 10px;
      font-weight: 800;
    }

    .state-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .state-button {
      min-height: 48px;
      padding: 8px 10px;
      border: 1px solid var(--outline-variant);
      border-radius: 14px;
      color: var(--on-surface-variant);
      background: var(--surface-container);
      cursor: pointer;
    }

    .state-button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .state-button[aria-pressed="true"] {
      border-color: var(--primary);
      color: var(--on-primary-container);
      background: var(--primary-container);
      font-weight: 750;
    }

    .rationale {
      margin: 0;
      padding: 14px 16px;
      border-radius: 16px;
      color: var(--on-secondary-container);
      background: color-mix(in srgb, var(--secondary-container) 72%, transparent);
      font-size: 13px;
      line-height: 1.55;
    }

    .device-stage { display: grid; place-items: center; min-width: 0; }

    .phone {
      position: relative;
      width: var(--phone-width);
      aspect-ratio: 390 / 844;
      max-height: calc(100vh - 48px);
      overflow: clip;
      border: 7px solid #26302d;
      border-radius: 42px;
      background: var(--surface);
      box-shadow: 0 30px 80px var(--shadow), 0 6px 18px rgba(0, 0, 0, .34);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 50;
      top: 8px;
      left: 50%;
      width: 82px;
      height: 22px;
      border-radius: 999px;
      background: #050908;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .game-page {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 82px 1fr 176px 1.05fr;
      min-height: 0;
      background:
        radial-gradient(circle at 50% 24%, rgba(0, 107, 96, .22), transparent 32%),
        var(--surface);
    }

    .app-bar {
      z-index: 5;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: end;
      gap: 4px;
      padding: 25px 12px 5px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      color: var(--on-surface);
      background: transparent;
      cursor: pointer;
      font-size: 24px;
    }

    .title-block { min-width: 0; text-align: center; }
    .title-block strong { display: block; font-size: 16px; }
    .title-block span { color: var(--on-surface-variant); font-size: 11px; }

    .arena {
      position: relative;
      display: grid;
      grid-template-rows: 32px 1fr;
      min-height: 0;
      padding: 8px 20px;
    }

    .player-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 700;
    }

    .player-id { display: flex; align-items: center; gap: 8px; }
    .avatar {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      font-weight: 850;
    }

    .player-state {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--surface-high);
      font-size: 10px;
    }

    .hand-stage { display: grid; place-items: center; min-height: 0; }
    .hand {
      display: grid;
      place-items: center;
      width: 126px;
      aspect-ratio: 1;
      border: 1px solid var(--outline-variant);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--surface-highest), var(--surface-container));
      color: var(--on-surface-variant);
      font-size: 54px;
      filter: saturate(.55);
    }

    .round-stage {
      position: relative;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 10px 24px;
    }

    .round-card {
      width: 100%;
      min-height: 132px;
      padding: 16px;
      border: 1px solid var(--outline-variant);
      border-radius: 26px;
      background: color-mix(in srgb, var(--surface-container) 92%, transparent);
      text-align: center;
    }

    .round-card .kicker { color: var(--primary); font-size: 11px; font-weight: 850; letter-spacing: .08em; }
    .round-card h2 { margin: 8px 0 4px; font-size: 21px; }
    .round-card p { margin: 0; color: var(--on-surface-variant); font-size: 12px; line-height: 1.5; }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 20px 28px;
    }

    .choice {
      display: grid;
      place-content: center;
      min-width: 0;
      min-height: 78px;
      border: 1px solid var(--outline-variant);
      border-radius: 22px;
      color: var(--on-surface-variant);
      background: var(--surface-container);
      opacity: .46;
      font-size: 26px;
    }

    .choice span { display: block; margin-top: 4px; font-size: 11px; }

    .connection-ui { position: absolute; z-index: 20; pointer-events: none; }

    .top-banner {
      top: 82px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--primary) 46%, transparent);
      border-radius: 18px;
      color: var(--on-secondary-container);
      background: color-mix(in srgb, var(--secondary-container) 94%, transparent);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .22);
    }

    .status-icon {
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      color: var(--on-primary);
      background: var(--primary);
      font-size: 18px;
      font-weight: 900;
    }

    .status-copy { min-width: 0; }
    .status-copy strong,
    .status-copy span { display: block; }
    .status-copy strong { font-size: 13px; }
    .status-copy span { margin-top: 2px; font-size: 11px; line-height: 1.35; }

    .inline-recovery {
      inset: auto 34px 280px;
      padding: 14px;
      border: 1px solid var(--outline-variant);
      border-radius: 20px;
      background: var(--surface-high);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
    }

    .inline-recovery .steps {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin-top: 12px;
    }

    .step {
      height: 4px;
      border-radius: 999px;
      background: var(--outline-variant);
    }

    .step.done,
    .step.active { background: var(--primary); }
    .step.active { animation: pulse 1.1s ease-in-out infinite alternate; }

    .bottom-panel {
      right: 0;
      bottom: 0;
      left: 0;
      padding: 10px 20px 24px;
      border-radius: 30px 30px 0 0;
      background: var(--surface-high);
      box-shadow: 0 -18px 45px rgba(0, 0, 0, .34);
      pointer-events: auto;
    }

    .drag-handle {
      width: 34px;
      height: 4px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: var(--outline);
    }

    .bottom-panel h3 { margin: 0; font-size: 19px; }
    .bottom-panel p { margin: 7px 0 16px; color: var(--on-surface-variant); font-size: 12px; line-height: 1.55; }
    .panel-actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; }
    .panel-actions button {
      min-height: 48px;
      border: 1px solid var(--outline);
      border-radius: 999px;
      color: var(--primary);
      background: transparent;
      font-weight: 750;
    }
    .panel-actions .primary-action { border-color: var(--primary); color: var(--on-primary); background: var(--primary); }

    .connection-ui[data-state="failed"] .status-icon {
      color: var(--on-error-container);
      background: var(--error-container);
    }

    .connection-ui[data-state="restored"] .status-icon {
      color: var(--on-success-container);
      background: var(--success-container);
    }

    .game-page[data-state="restored"] .choice { opacity: 1; }

    @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 820px) {
      .prototype { grid-template-columns: 1fr; gap: 28px; padding: 24px 16px 40px; }
      .control-panel { width: min(540px, 100%); margin-inline: auto; }
      .phone { max-height: none; }
    }
  </style>
</head>
<body>
  <main class="prototype">
    <section class="control-panel">
      <header>
        <p class="eyebrow">Gamebox UX exploration</p>
        <h1>连接恢复，不该挡住整场游戏</h1>
        <p class="intro">三个方案都保留最后一次确认的对局画面，只暂停需要服务器确认的操作。先选布局，再切换状态查看完整恢复流程。</p>
      </header>

      <fieldset>
        <legend>选择布局方案</legend>
        <div class="option-list">
          <div>
            <input class="option-input" type="radio" name="layout" id="layout-a" value="a" checked>
            <label class="option-card" for="layout-a">
              <span class="option-letter">A</span>
              <span><strong>顶部轻提示</strong><small>最少打断，状态变化一眼可见</small></span>
              <span class="recommended">推荐</span>
            </label>
          </div>
          <div>
            <input class="option-input" type="radio" name="layout" id="layout-b" value="b">
            <label class="option-card" for="layout-b">
              <span class="option-letter">B</span>
              <span><strong>场内状态卡</strong><small>过程最清楚，视觉更有仪式感</small></span>
              <span></span>
            </label>
          </div>
          <div>
            <input class="option-input" type="radio" name="layout" id="layout-c" value="c">
            <label class="option-card" for="layout-c">
              <span class="option-letter">C</span>
              <span><strong>底部恢复面板</strong><small>适合失败后需要用户作决定</small></span>
              <span></span>
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>切换连接状态</legend>
        <div class="state-list">
          <button class="state-button" type="button" data-state="reconnecting" aria-pressed="true">重连中</button>
          <button class="state-button" type="button" data-state="syncing" aria-pressed="false">同步中</button>
          <button class="state-button" type="button" data-state="failed" aria-pressed="false">连接失败</button>
          <button class="state-button" type="button" data-state="restored" aria-pressed="false">已恢复</button>
        </div>
      </fieldset>

      <p class="rationale" id="rationale">推荐 A：网络波动时只出现短横幅，玩家仍能看见已确认的出拳状态；操作暂时锁定，但不会误以为页面卡死。</p>
    </section>

    <section class="device-stage" aria-label="手机交互预览">
      <div class="phone">
        <div class="game-page" id="game-page" data-state="reconnecting">
          <header class="app-bar">
            <button class="icon-button" type="button" aria-label="返回">‹</button>
            <div class="title-block"><strong>石头剪刀布</strong><span>一局定胜负</span></div>
            <button class="icon-button" type="button" aria-label="更多">•••</button>
          </header>

          <section class="arena">
            <div class="player-line">
              <span class="player-id"><span class="avatar">对</span>对手</span>
              <span class="player-state">已出拳</span>
            </div>
            <div class="hand-stage"><div class="hand">?</div></div>
          </section>

          <section class="round-stage">
            <div class="round-card">
              <span class="kicker">ROUND 1</span>
              <h2>等待双方揭晓</h2>
              <p>你已选择石头，对手的选择仍然保密</p>
            </div>
          </section>

          <section class="arena">
            <div class="player-line">
              <span class="player-id"><span class="avatar">我</span>你</span>
              <span class="player-state">已出拳</span>
            </div>
            <div class="hand-stage"><div class="hand">✊</div></div>
          </section>

          <div class="choices" aria-hidden="true">
            <div class="choice">✊<span>石头</span></div>
            <div class="choice">✌️<span>剪刀</span></div>
            <div class="choice">✋<span>布</span></div>
          </div>

          <aside class="connection-ui top-banner" id="connection-ui" data-state="reconnecting">
            <span class="status-icon" id="status-icon">↻</span>
            <span class="status-copy"><strong id="status-title">正在恢复连接</strong><span id="status-detail">已确认的出拳状态会保留</span></span>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script>
    const layouts = {
      a: {
        className: 'top-banner',
        rationale: '推荐 A：网络波动时只出现短横幅，玩家仍能看见已确认的出拳状态；操作暂时锁定，但不会误以为页面卡死。'
      },
      b: {
        className: 'inline-recovery',
        rationale: 'B 更强调恢复进程：三段式轨道分别对应连接、同步和恢复。适合平均重连时间较长，但会占用场内视觉焦点。'
      },
      c: {
        className: 'bottom-panel',
        rationale: 'C 的操作最明确，适合多次重试失败后升级出现。若每次轻微抖动都弹出，会比 A 更打断比赛节奏。'
      }
    };

    const states = {
      reconnecting: { icon: '↻', title: '正在恢复连接', detail: '已确认的出拳状态会保留', step: 1 },
      syncing: { icon: '↓', title: '连接已恢复', detail: '正在同步最新对局状态…', step: 2 },
      failed: { icon: '!', title: '暂时无法连接', detail: '检查网络后重试，或安全返回大厅', step: 0 },
      restored: { icon: '✓', title: '已恢复对局', detail: '状态已同步，可以继续操作', step: 3 }
    };

    const connectionUi = document.querySelector('#connection-ui');
    const gamePage = document.querySelector('#game-page');
    const rationale = document.querySelector('#rationale');
    let layout = 'a';
    let state = 'reconnecting';

    function render() {
      const layoutData = layouts[layout];
      const stateData = states[state];
      connectionUi.className = `connection-ui ${layoutData.className}`;
      connectionUi.dataset.state = state;
      gamePage.dataset.state = state;
      rationale.textContent = layoutData.rationale;

      if (layout === 'c') {
        connectionUi.innerHTML = `
          <div class="drag-handle"></div>
          <h3>${stateData.title}</h3>
          <p>${stateData.detail}</p>
          <div class="panel-actions">
            <button type="button">返回大厅</button>
            <button class="primary-action" type="button">${state === 'failed' ? '重新连接' : '继续等待'}</button>
          </div>`;
      } else if (layout === 'b') {
        connectionUi.innerHTML = `
          <span class="status-copy"><strong>${stateData.title}</strong><span>${stateData.detail}</span></span>
          <div class="steps" aria-hidden="true">
            ${[1, 2, 3].map((step) => `<span class="step ${step < stateData.step ? 'done' : step === stateData.step ? 'active' : ''}"></span>`).join('')}
          </div>`;
      } else {
        connectionUi.innerHTML = `
          <span class="status-icon">${stateData.icon}</span>
          <span class="status-copy"><strong>${stateData.title}</strong><span>${stateData.detail}</span></span>`;
      }
    }

    document.querySelectorAll('input[name="layout"]').forEach((input) => {
      input.addEventListener('change', (event) => {
        layout = event.target.value;
        render();
      });
    });

    document.querySelectorAll('.state-button').forEach((button) => {
      button.addEventListener('click', () => {
        state = button.dataset.state;
        document.querySelectorAll('.state-button').forEach((item) => {
          item.setAttribute('aria-pressed', String(item === button));
        });
        render();
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamebox · 游戏终局体验预览</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #006b60;
      --on-brand: #ffffff;
      --brand-container: #9ef2e3;
      --on-brand-container: #005048;
      --surface: #f4fbf8;
      --surface-low: #edf5f2;
      --surface-high: #e2ebe7;
      --surface-highest: #dbe5e1;
      --on-surface: #161d1b;
      --muted: #46514d;
      --outline: #74807b;
      --outline-soft: #bdc9c4;
      --scrim: rgba(5, 29, 26, 0.48);
      --success: #136b4f;
      --success-container: #b5efd4;
      --loss: #745b00;
      --loss-container: #f6e49c;
      --board: #d9b277;
      --board-line: rgba(65, 43, 21, 0.5);
      --shadow: rgba(0, 48, 42, 0.2);
      font-family: Inter, "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--on-surface);
      background:
        radial-gradient(circle at 10% 8%, rgba(158, 242, 227, 0.78), transparent 32rem),
        linear-gradient(145deg, #e9f5f1, #f6f4ed 52%, #dceee9);
    }

    button { font: inherit; }

    .prototype {
      display: grid;
      grid-template-columns: minmax(252px, 320px) minmax(390px, 1fr);
      gap: clamp(32px, 6vw, 88px);
      min-height: 100vh;
      padding: 32px clamp(24px, 5vw, 80px);
      align-items: center;
    }

    .controls {
      display: grid;
      gap: 24px;
      align-content: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .control-group { display: grid; gap: 8px; }
    .control-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .segmented { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

    .control-button {
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--outline-soft);
      border-radius: 14px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.64);
      cursor: pointer;
      transition: transform 100ms ease, background 180ms ease, border-color 180ms ease;
    }

    .control-button:hover { background: #ffffff; }
    .control-button:active { transform: scale(0.97); }
    .control-button[aria-pressed="true"] {
      border-color: var(--brand);
      color: var(--on-brand-container);
      background: var(--brand-container);
      font-weight: 750;
    }

    .design-note {
      margin: 0;
      padding: 16px;
      border-radius: 18px;
      color: var(--on-brand-container);
      background: color-mix(in srgb, var(--brand-container) 70%, transparent);
      font-size: 13px;
      line-height: 1.6;
    }

    .stage { display: grid; place-items: center; min-width: 0; }

    .phone {
      position: relative;
      width: min(390px, calc(100vw - 32px));
      aspect-ratio: 390 / 844;
      max-height: calc(100vh - 40px);
      overflow: clip;
      border: 7px solid #17211f;
      border-radius: 42px;
      color: var(--on-surface);
      background: var(--surface);
      box-shadow: 0 30px 80px var(--shadow), 0 5px 16px rgba(0, 0, 0, 0.13);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 60;
      top: 8px;
      left: 50%;
      width: 82px;
      height: 22px;
      border-radius: 999px;
      background: #111a18;
      transform: translateX(-50%);
    }

    .game-screen {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 82px 1fr;
      background: var(--surface);
    }

    .top-bar {
      z-index: 4;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: end;
      gap: 8px;
      padding: 27px 12px 7px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 999px;
      color: var(--on-surface);
      background: transparent;
      cursor: pointer;
      font-size: 25px;
    }

    .icon-button:active { background: var(--surface-highest); }
    .title { min-width: 0; text-align: center; }
    .title strong { display: block; font-size: 16px; line-height: 22px; }
    .title span { color: var(--muted); font-size: 11px; }

    .game-content { position: relative; min-height: 0; overflow: hidden; }
    .game-view { position: absolute; inset: 0; }

    .gomoku-view {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 12px 18px 24px;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-low) 100%);
    }

    .turn-card,
    .score-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 10px 14px;
      border-radius: 20px;
      background: var(--surface-high);
    }

    .player { display: grid; gap: 2px; }
    .player strong { font-size: 14px; }
    .player span { color: var(--muted); font-size: 11px; }
    .piece-mark { width: 28px; height: 28px; border-radius: 50%; background: #171918; box-shadow: 0 2px 5px rgba(0,0,0,.25); }

    .board-shell { display: grid; place-items: center; min-height: 0; }
    .board {
      position: relative;
      width: min(100%, 338px);
      aspect-ratio: 1;
      border: 9px solid var(--board);
      border-radius: 18px;
      background-color: var(--board);
      background-image:
        repeating-linear-gradient(to right, transparent 0, transparent calc(7.1428% - 1px), var(--board-line) calc(7.1428% - 1px), var(--board-line) 7.1428%),
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(7.1428% - 1px), var(--board-line) calc(7.1428% - 1px), var(--board-line) 7.1428%);
      box-shadow: inset 0 0 0 1px rgba(76, 48, 20, 0.24), 0 8px 20px rgba(72, 49, 24, 0.15);
    }

    .stone {
      position: absolute;
      width: 6.3%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
    }

    .stone.black { background: radial-gradient(circle at 34% 28%, #5d625f, #111312 62%); }
    .stone.white { background: radial-gradient(circle at 34% 28%, #fff, #d8dcda 68%); border: 1px solid rgba(0,0,0,.16); }
    .stone.winner { box-shadow: 0 0 0 3px #ffcf4a, 0 0 16px 5px rgba(255, 207, 74, 0.72); }
    .board-caption { text-align: center; color: var(--muted); font-size: 12px; }

    .rps-view {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      min-height: 0;
      background:
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--brand-container) 65%, transparent), transparent 42%),
        var(--surface);
    }

    .fighter {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 8px;
      padding: 14px 20px;
    }

    .fighter.opponent { transform: rotate(180deg); }
    .fighter.opponent .fighter-label { transform: rotate(180deg); }
    .hand-disc {
      display: grid;
      place-items: center;
      width: 126px;
      height: 126px;
      border-radius: 38px;
      background: var(--surface-high);
      box-shadow: inset 0 0 0 1px var(--outline-soft), 0 10px 28px rgba(0,0,0,.08);
    }

    .hand-disc img { width: 96px; height: 96px; object-fit: contain; }
    .fighter-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .versus { display: grid; place-items: center; gap: 8px; }
    .score { font-size: 34px; font-weight: 850; letter-spacing: .08em; }
    .format { padding: 5px 12px; border-radius: 999px; color: var(--on-brand-container); background: var(--brand-container); font-size: 11px; font-weight: 750; }

    .result-layer {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: grid;
      align-items: end;
      padding: 18px;
      background: linear-gradient(to bottom, rgba(7, 23, 21, 0.08) 22%, var(--scrim) 68%);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 220ms ease;
    }

    .result-card {
      position: relative;
      overflow: hidden;
      padding: 22px 20px 18px;
      border: 1px solid color-mix(in srgb, var(--outcome-color) 24%, var(--outline-soft));
      border-radius: 30px;
      background: color-mix(in srgb, var(--surface) 94%, var(--outcome-container));
      box-shadow: 0 16px 42px rgba(0,0,0,.22);
      transform: translateY(0);
      transition: transform 320ms cubic-bezier(.2,.8,.2,1), opacity 220ms ease;
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: var(--outcome-color);
    }

    .result-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .outcome-chip { padding: 6px 12px; border-radius: 999px; color: var(--outcome-color); background: var(--outcome-container); font-size: 12px; font-weight: 850; }
    .confirmed { color: var(--muted); font-size: 11px; }
    .result-card h2 { margin: 18px 0 6px; font-size: 27px; line-height: 1.12; letter-spacing: -0.03em; }
    .result-copy { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 18px 0;
    }

    .summary-item { padding: 10px 6px; border-radius: 14px; text-align: center; background: var(--surface-high); }
    .summary-item strong { display: block; font-size: 15px; }
    .summary-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 10px; }

    .action {
      min-height: 50px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 750;
    }

    .action.secondary { border: 1px solid var(--outline); color: var(--on-surface); background: transparent; }
    .action.primary { border: 0; color: var(--on-brand); background: var(--brand); }
    .action:active { transform: scale(.98); }

    .result-pill {
      position: absolute;
      z-index: 29;
      right: 18px;
      bottom: 20px;
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: var(--on-brand);
      background: var(--brand);
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 220ms ease;
    }

    .phone.reviewing .result-layer { opacity: 0; pointer-events: none; }
    .phone.reviewing .result-card { transform: translateY(28px); opacity: 0; }
    .phone.reviewing .result-pill { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .phone[data-outcome="win"] { --outcome-color: var(--success); --outcome-container: var(--success-container); }
    .phone[data-outcome="loss"] { --outcome-color: var(--loss); --outcome-container: var(--loss-container); }
    .phone[data-game="gomoku"] .rps-view,
    .phone[data-game="rps"] .gomoku-view { display: none; }

    .phone.dark {
      color-scheme: dark;
      --brand: #82d5c7;
      --on-brand: #003731;
      --brand-container: #005047;
      --on-brand-container: #9ef2e3;
      --surface: #0f1513;
      --surface-low: #161d1b;
      --surface-high: #202825;
      --surface-highest: #2b3431;
      --on-surface: #dce5e1;
      --muted: #bbc9c4;
      --outline: #899793;
      --outline-soft: #3d4a46;
      --scrim: rgba(0, 0, 0, .62);
      --success: #88d9b7;
      --success-container: #124f3d;
      --loss: #e4ca72;
      --loss-container: #514500;
      --board: #9f7549;
      --board-line: rgba(30, 19, 10, .62);
    }

    .phone.dark .piece-mark { background: #f4f6f5; border: 1px solid rgba(0,0,0,.2); }

    @media (max-width: 820px) {
      .prototype { grid-template-columns: 1fr; padding: 24px 16px 40px; }
      .controls { width: min(100%, 520px); justify-self: center; }
      .stage { padding-top: 8px; }
      .phone { max-height: none; }
    }

    @media (max-height: 720px) and (min-width: 821px) {
      .phone { width: 315px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="prototype">
    <section class="controls" aria-labelledby="page-title">
      <header>
        <p class="eyebrow">Gamebox · Result UX</p>
        <h1 id="page-title">终局不是弹窗，<br>是最后一步体验。</h1>
        <p class="intro">保留最后确认的局面，让胜负有依据；用同一套行为收尾，同时保留五子棋的克制和石头剪刀布的揭晓感。</p>
      </header>

      <div class="control-group">
        <span class="control-label">游戏</span>
        <div class="segmented" id="gameControls">
          <button class="control-button" type="button" data-game="gomoku" aria-pressed="true">五子棋</button>
          <button class="control-button" type="button" data-game="rps" aria-pressed="false">石头剪刀布</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">结果</span>
        <div class="segmented" id="outcomeControls">
          <button class="control-button" type="button" data-outcome="win" aria-pressed="true">胜利</button>
          <button class="control-button" type="button" data-outcome="loss" aria-pressed="false">惜败</button>
        </div>
      </div>

      <div class="segmented">
        <button class="control-button" type="button" id="reviewControl">回看终局</button>
        <button class="control-button" type="button" id="themeControl">切换明暗</button>
      </div>

      <p class="design-note">不提供“再来一局”：当前服务端没有重赛契约。主要动作保持为“返回大厅”，回看只在本地收起结果层，不改变权威对局状态。</p>
    </section>

    <section class="stage" aria-label="手机端终局预览">
      <article class="phone" id="phone" data-game="gomoku" data-outcome="win">
        <div class="game-screen">
          <header class="top-bar">
            <button class="icon-button" type="button" aria-label="返回">‹</button>
            <div class="title"><strong id="gameTitle">五子棋</strong><span>对局已结束</span></div>
            <span></span>
          </header>

          <div class="game-content">
            <section class="game-view gomoku-view" aria-label="五子棋终局棋盘">
              <div class="turn-card">
                <div class="player"><strong>你 · 黑棋</strong><span id="gomokuStateLine">最后落子 · H8</span></div>
                <span class="piece-mark" aria-hidden="true"></span>
              </div>
              <div class="board-shell"><div class="board" id="board"></div></div>
              <div class="board-caption" id="boardCaption">最后确认局面 · 你的获胜五子已标记</div>
            </section>

            <section class="game-view rps-view" aria-label="石头剪刀布终局">
              <div class="fighter opponent">
                <div class="hand-disc"><img id="opponentHand" src="../../game_runtime/games/rps/assets/rock.png" width="96" height="96" alt="对手出了石头"></div>
                <span class="fighter-label" id="opponentHandLabel">对手 · 石头</span>
              </div>
              <div class="versus"><strong class="score" id="arenaScore">2 : 1</strong><span class="format">三局两胜 · 已确认</span></div>
              <div class="fighter">
                <div class="hand-disc"><img id="myHand" src="../../game_runtime/games/rps/assets/paper.png" width="96" height="96" alt="你出了布"></div>
                <span class="fighter-label" id="myHandLabel">你 · 布</span>
              </div>
            </section>

            <div class="result-layer" id="resultLayer">
              <section class="result-card" aria-labelledby="resultTitle">
                <div class="result-meta"><span class="outcome-chip" id="outcomeChip">胜利</span><span class="confirmed">✓ 结果已确认</span></div>
                <h2 id="resultTitle">漂亮的一局</h2>
                <p class="result-copy" id="resultCopy">你执黑，在第 42 手连成五子。</p>
                <div class="summary" id="summary"></div>
                <div class="actions">
                  <button class="action secondary" type="button" id="reviewButton">回看终局</button>
                  <button class="action primary" type="button">返回大厅</button>
                </div>
              </section>
            </div>
            <button class="result-pill" type="button" id="resultPill">查看结果</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const phone = document.querySelector("#phone");
    const gameTitle = document.querySelector("#gameTitle");
    const outcomeChip = document.querySelector("#outcomeChip");
    const resultTitle = document.querySelector("#resultTitle");
    const resultCopy = document.querySelector("#resultCopy");
    const summary = document.querySelector("#summary");
    const arenaScore = document.querySelector("#arenaScore");
    const board = document.querySelector("#board");
    const gomokuStateLine = document.querySelector("#gomokuStateLine");
    const boardCaption = document.querySelector("#boardCaption");
    const myHand = document.querySelector("#myHand");
    const myHandLabel = document.querySelector("#myHandLabel");
    const reviewControl = document.querySelector("#reviewControl");

    const content = {
      gomoku: {
        title: "五子棋",
        win: { chip: "胜利", title: "漂亮的一局", copy: "你执黑，在第 42 手连成五子。", items: [["42 手", "本局手数"], ["H8", "制胜落点"], ["12:36", "对局时长"]] },
        loss: { chip: "惜败", title: "这局差一点", copy: "对手在第 38 手连成五子，终局已经保留。", items: [["38 手", "本局手数"], ["G11", "终局落点"], ["10:52", "对局时长"]] }
      },
      rps: {
        title: "石头剪刀布",
        win: { chip: "胜利", title: "你拿下了这场对局", copy: "最后一轮，布包住石头。", score: "2 : 1", items: [["2 : 1", "最终比分"], ["3 轮", "完成轮次"], ["布 › 石头", "制胜选择"]] },
        loss: { chip: "惜败", title: "对手先拿到两分", copy: "最后一轮，石头砸碎剪刀。", score: "1 : 2", items: [["1 : 2", "最终比分"], ["3 轮", "完成轮次"], ["剪刀 ‹ 石头", "最后一轮"]] }
      }
    };

    const stones = [
      [3, 3, "black"], [4, 3, "white"], [5, 4, "black"], [6, 4, "white"],
      [4, 5, "black"], [7, 5, "white"], [5, 6, "black"], [6, 6, "white"],
      [6, 7, "black winner"], [7, 7, "white"], [7, 8, "black winner"], [8, 8, "white"],
      [8, 9, "black winner"], [9, 9, "white"], [9, 10, "black winner"], [10, 10, "white"],
      [10, 11, "black winner"], [3, 9, "white"], [11, 5, "black"], [2, 8, "white"]
    ];

    for (const [x, y, className] of stones) {
      const stone = document.createElement("span");
      stone.className = `stone ${className}`;
      stone.dataset.baseColor = className.split(" ")[0];
      stone.style.left = `${x / 14 * 100}%`;
      stone.style.top = `${y / 14 * 100}%`;
      board.append(stone);
    }

    function setPressed(container, selected) {
      for (const button of container.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", String(button === selected));
      }
    }

    function render() {
      const state = content[phone.dataset.game][phone.dataset.outcome];
      gameTitle.textContent = content[phone.dataset.game].title;
      outcomeChip.textContent = state.chip;
      resultTitle.textContent = state.title;
      resultCopy.textContent = state.copy;
      arenaScore.textContent = state.score ?? "2 : 1";
      gomokuStateLine.textContent = phone.dataset.outcome === "win" ? "最后落子 · H8" : "对手落子 · G11";
      boardCaption.textContent = phone.dataset.outcome === "win"
        ? "最后确认局面 · 你的获胜五子已标记"
        : "最后确认局面 · 对手的获胜五子已标记";
      for (const stone of board.querySelectorAll(".stone.winner")) {
        stone.classList.remove("black", "white");
        stone.classList.add(phone.dataset.outcome === "win" ? "black" : "white");
      }
      const myChoice = phone.dataset.outcome === "win" ? "paper" : "scissors";
      const myChoiceName = phone.dataset.outcome === "win" ? "布" : "剪刀";
      myHand.src = `../../game_runtime/games/rps/assets/${myChoice}.png`;
      myHand.alt = `你出了${myChoiceName}`;
      myHandLabel.textContent = `你 · ${myChoiceName}`;
      summary.replaceChildren(...state.items.map(([value, label]) => {
        const item = document.createElement("div");
        item.className = "summary-item";
        const strong = document.createElement("strong");
        const span = document.createElement("span");
        strong.textContent = value;
        span.textContent = label;
        item.append(strong, span);
        return item;
      }));
      phone.classList.remove("reviewing");
      reviewControl.textContent = "回看终局";
    }

    document.querySelector("#gameControls").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-game]");
      if (!button) return;
      phone.dataset.game = button.dataset.game;
      setPressed(event.currentTarget, button);
      render();
    });

    document.querySelector("#outcomeControls").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-outcome]");
      if (!button) return;
      phone.dataset.outcome = button.dataset.outcome;
      setPressed(event.currentTarget, button);
      render();
    });

    document.querySelector("#reviewButton").addEventListener("click", () => {
      phone.classList.add("reviewing");
      reviewControl.textContent = "显示结果";
    });
    reviewControl.addEventListener("click", () => {
      phone.classList.toggle("reviewing");
      reviewControl.textContent = phone.classList.contains("reviewing") ? "显示结果" : "回看终局";
    });
    document.querySelector("#resultPill").addEventListener("click", () => {
      phone.classList.remove("reviewing");
      reviewControl.textContent = "回看终局";
    });
    document.querySelector("#themeControl").addEventListener("click", () => phone.classList.toggle("dark"));
    render();
  </script>
</body>
</html>

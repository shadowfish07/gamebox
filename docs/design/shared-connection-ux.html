<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gamebox · 跨游戏连接 UX</title>
  <style>
    @layer reset, base, components, states, responsive;

    @layer reset {
      html { box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }
      body, h1, h2, h3, p, fieldset { margin: 0; }
      button, input { font: inherit; }
    }

    @layer base {
      :root {
        color-scheme: dark;
        --bg: #0b0f0f;
        --surface: #121817;
        --surface-high: #1b2422;
        --surface-bright: #25312f;
        --line: #344440;
        --text: #e4ebe8;
        --muted: #9baaa6;
        --primary: #56dbc7;
        --on-primary: #003730;
        --primary-soft: #173c37;
        --error: #ffb4ab;
        --error-bg: #5b1b19;
        --shadow: 0 24px 70px rgb(0 0 0 / 42%);
        --radius-lg: 28px;
        --radius-md: 18px;
        --radius-sm: 12px;
        --status-size: 3.25rem;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-block-size: 100dvh;
        background:
          radial-gradient(circle at 18% 12%, rgb(46 135 119 / 18%), transparent 34rem),
          var(--bg);
        color: var(--text);
      }

      button { color: inherit; }
      button:focus-visible, input:focus-visible + span {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }

      .page {
        display: grid;
        grid-template-columns: minmax(17rem, 21rem) minmax(20rem, 1fr);
        gap: clamp(1.5rem, 4vw, 4rem);
        align-items: center;
        inline-size: min(76rem, 100%);
        min-block-size: 100dvh;
        margin-inline: auto;
        padding: clamp(1.25rem, 4vw, 4rem);
      }

      .eyebrow {
        color: var(--primary);
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 {
        margin-block-start: .75rem;
        font-size: clamp(2rem, 1.4rem + 2.4vw, 3.5rem);
        line-height: 1.04;
        letter-spacing: -.04em;
        text-wrap: balance;
      }

      .intro {
        margin-block-start: 1rem;
        color: var(--muted);
        line-height: 1.65;
        text-wrap: pretty;
      }
    }

    @layer components {
      .controls {
        display: grid;
        gap: 1.5rem;
      }

      .control-group {
        display: grid;
        gap: .75rem;
        border: 0;
        padding: 0;
      }

      .control-group legend {
        margin-block-end: .75rem;
        color: var(--muted);
        font-size: .78rem;
        font-weight: 700;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .5rem;
        padding: .35rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: rgb(18 24 23 / 72%);
      }

      .segmented label, .state-grid label {
        cursor: pointer;
      }

      .segmented input, .state-grid input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        opacity: 0;
      }

      .segmented span, .state-grid span {
        display: grid;
        place-items: center;
        min-block-size: 3rem;
        padding-inline: .75rem;
        border-radius: .75rem;
        font-size: .84rem;
        font-weight: 750;
        text-align: center;
        transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .segmented label:has(input:checked) span {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .state-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .55rem;
      }

      .state-grid span {
        border: 1px solid var(--line);
        color: var(--muted);
        background: var(--surface);
      }

      .state-grid label:has(input:checked) span {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }

      .state-grid label:last-child { grid-column: 1 / -1; }

      .principles {
        display: grid;
        gap: .7rem;
        padding-block-start: .25rem;
        color: var(--muted);
        font-size: .8rem;
      }

      .principle {
        display: flex;
        gap: .65rem;
        align-items: center;
      }

      .check {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        inline-size: 1.3rem;
        block-size: 1.3rem;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: .72rem;
        font-weight: 900;
      }

      .stage { display: grid; place-items: center; }

      .phone {
        inline-size: min(24.375rem, 100%);
        min-block-size: min(52.75rem, calc(100dvh - 3rem));
        overflow: clip;
        border: 1px solid #445551;
        border-radius: 2.6rem;
        background: #0f1514;
        box-shadow: var(--shadow);
      }

      .system-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        block-size: 2.2rem;
        padding-inline: 1.55rem;
        color: #c7d1ce;
        font-size: .7rem;
        font-weight: 700;
      }

      .app-bar {
        display: grid;
        grid-template-columns: 3rem 1fr 3rem;
        align-items: center;
        min-block-size: 3.5rem;
        padding-inline: .75rem;
      }

      .icon-button {
        display: grid;
        place-items: center;
        min-inline-size: 3rem;
        min-block-size: 3rem;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        font-size: 1.35rem;
      }

      .icon-button:hover:not(:disabled) { background: var(--surface-high); }

      .app-title {
        text-align: center;
        font-size: 1rem;
        font-weight: 800;
      }

      .status-slot {
        min-block-size: var(--status-size);
        padding-inline: .75rem;
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: .65rem;
        min-block-size: var(--status-size);
        padding-inline: 1rem;
        border: 1px solid #35645d;
        border-radius: var(--radius-sm);
        background: #17332f;
        color: #b8f3e8;
        font-size: .84rem;
        font-weight: 750;
      }

      .status-bar[hidden] { display: none; }

      .status-text { min-inline-size: 0; }

      .spinner {
        flex: 0 0 auto;
        inline-size: 1rem;
        block-size: 1rem;
        border: 2px solid rgb(184 243 232 / 28%);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 850ms linear infinite;
      }

      .error-dot {
        display: none;
        flex: 0 0 auto;
        place-items: center;
        inline-size: 1.15rem;
        block-size: 1.15rem;
        border-radius: 50%;
        background: var(--error);
        color: #690005;
        font-size: .75rem;
        font-weight: 900;
      }

      .status-action {
        min-block-size: 2.5rem;
        margin-inline-start: auto;
        padding-inline: .75rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: .76rem;
        font-weight: 800;
      }

      .game {
        display: grid;
        min-block-size: calc(min(52.75rem, 100dvh - 3rem) - 5.7rem - var(--status-size));
        padding: .8rem 1rem 1.25rem;
        transition: opacity 160ms ease, filter 160ms ease;
      }

      .game[aria-busy="true"] .interactive {
        pointer-events: none;
        opacity: .46;
        filter: saturate(.55);
      }

      .rps-game { align-content: space-between; gap: 1rem; }

      .player-card {
        display: flex;
        align-items: center;
        gap: .75rem;
        padding: .8rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .avatar {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        inline-size: 2.65rem;
        block-size: 2.65rem;
        border-radius: 50%;
        background: var(--surface-bright);
        font-size: 1.15rem;
      }

      .player-meta { min-inline-size: 0; }
      .player-name { font-size: .88rem; font-weight: 800; }
      .player-state { margin-block-start: .1rem; color: var(--muted); font-size: .72rem; }
      .score { margin-inline-start: auto; color: var(--primary); font-size: 1.35rem; font-weight: 900; }

      .arena {
        display: grid;
        place-items: center;
        gap: 1.2rem;
        min-block-size: 14rem;
      }

      .versus {
        display: grid;
        place-items: center;
        inline-size: 8.5rem;
        aspect-ratio: 1;
        border: 1px solid #2c514b;
        border-radius: 50%;
        background: radial-gradient(circle, #173c37 0 38%, transparent 40%);
        color: var(--primary);
        font-size: 2.5rem;
        font-weight: 950;
        letter-spacing: -.08em;
      }

      .round-note { color: var(--muted); font-size: .78rem; }

      .choices {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: .65rem;
      }

      .choice {
        display: grid;
        place-items: center;
        gap: .35rem;
        min-block-size: 5.3rem;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface-high);
        cursor: pointer;
        font-size: .72rem;
        font-weight: 800;
      }

      .choice strong { font-size: 1.65rem; }
      .choice:hover:not(:disabled) { border-color: var(--primary); }

      .gomoku-game { align-content: start; gap: 1rem; }

      .turn-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: .8rem 1rem;
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .turn-label { color: var(--muted); font-size: .72rem; }
      .turn-player { margin-block-start: .2rem; font-size: .95rem; font-weight: 850; }

      .stone {
        inline-size: 2rem;
        block-size: 2rem;
        border-radius: 50%;
        background: #e8edea;
        box-shadow: inset 0 -.22rem .35rem rgb(0 0 0 / 28%);
      }

      .board-wrap {
        padding: .75rem;
        border-radius: var(--radius-md);
        background: #b68756;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 12%);
      }

      .board {
        position: relative;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        aspect-ratio: 1;
        background-image:
          linear-gradient(to right, transparent calc(50% - .5px), #60452e calc(50% - .5px), #60452e calc(50% + .5px), transparent calc(50% + .5px)),
          linear-gradient(to bottom, transparent calc(50% - .5px), #60452e calc(50% - .5px), #60452e calc(50% + .5px), transparent calc(50% + .5px));
        background-size: 12.5% 12.5%;
      }

      .cell {
        min-inline-size: 0;
        min-block-size: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .cell:nth-child(31)::after, .cell:nth-child(41)::after, .cell:nth-child(50)::after {
        content: "";
        display: block;
        inline-size: 70%;
        aspect-ratio: 1;
        margin: auto;
        border-radius: 50%;
        box-shadow: inset 0 -.18rem .25rem rgb(255 255 255 / 18%), 0 .16rem .25rem rgb(0 0 0 / 36%);
      }

      .cell:nth-child(31)::after, .cell:nth-child(50)::after { background: #121515; }
      .cell:nth-child(41)::after { background: #edf0ee; }

      .board-note {
        color: var(--muted);
        font-size: .74rem;
        text-align: center;
      }

      .hidden-game { display: none; }
    }

    @layer states {
      .phone[data-state="ready"] { --status-size: 0rem; }

      .phone[data-state="ready"] .status-slot { padding-inline: 0; }

      .phone[data-state="failed"] .status-bar {
        border-color: #8d4943;
        background: var(--error-bg);
        color: var(--error);
      }

      .phone[data-state="failed"] .spinner { display: none; }
      .phone[data-state="failed"] .error-dot { display: grid; }
      .phone:not([data-state="failed"]) .status-action { display: none; }

      @keyframes spin { to { transform: rotate(1turn); } }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; border-color: currentColor; }
        .segmented span, .state-grid span, .game { transition: none; }
      }

      @media (forced-colors: active) {
        .status-bar, .state-grid span, .segmented, .player-card, .choice {
          border-color: CanvasText;
        }
      }
    }

    @layer responsive {
      @media (max-width: 50rem) {
        .page {
          grid-template-columns: 1fr;
          align-items: start;
          padding-block: 2rem;
        }

        .controls { inline-size: min(30rem, 100%); margin-inline: auto; }
        .stage { align-items: start; }
        .phone { min-block-size: 48rem; }
        .game { min-block-size: calc(48rem - 5.7rem - var(--status-size)); }
      }

      @media (pointer: coarse) {
        .segmented span, .state-grid span, .status-action { min-block-size: 3rem; }
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="controls" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Gamebox Shared UX</p>
        <h1 id="page-title">连接状态，只说一次</h1>
        <p class="intro">游戏画面先出现，顶部只保留一条简短连接状态。恢复后立即隐藏，不用“连接成功”打断玩家。</p>
      </div>

      <fieldset class="control-group">
        <legend>切换游戏 · 验证同一套 UX</legend>
        <div class="segmented">
          <label><input type="radio" name="game" value="rps" checked><span>✊ 石头剪刀布</span></label>
          <label><input type="radio" name="game" value="gomoku"><span>● 五子棋</span></label>
        </div>
      </fieldset>

      <fieldset class="control-group">
        <legend>切换连接状态</legend>
        <div class="state-grid">
          <label><input type="radio" name="state" value="connecting" checked><span>连接中…</span></label>
          <label><input type="radio" name="state" value="syncing"><span>同步中…</span></label>
          <label><input type="radio" name="state" value="reconnecting"><span>重连中…</span></label>
          <label><input type="radio" name="state" value="failed"><span>连接失败</span></label>
          <label><input type="radio" name="state" value="ready"><span>已连接 · 状态条立即隐藏</span></label>
        </div>
      </fieldset>

      <section class="principles" aria-label="方案原则">
        <p class="principle"><span class="check">✓</span>不遮挡游戏，不重复提示</p>
        <p class="principle"><span class="check">✓</span>未就绪时保留画面，仅禁用操作</p>
        <p class="principle"><span class="check">✓</span>文案由共用组件统一管理</p>
      </section>
    </section>

    <section class="stage" aria-label="手机交互预览">
      <article class="phone" data-state="connecting">
        <div class="system-bar"><span>9:41</span><span>●●● ◒ ■</span></div>
        <header class="app-bar">
          <button class="icon-button" type="button" aria-label="返回大厅">‹</button>
          <p class="app-title">石头剪刀布</p>
          <span aria-hidden="true"></span>
        </header>

        <div class="status-slot" aria-live="polite">
          <div class="status-bar">
            <span class="spinner" aria-hidden="true"></span>
            <span class="error-dot" aria-hidden="true">!</span>
            <span class="status-text">连接中…</span>
            <button class="status-action" type="button">返回大厅</button>
          </div>
        </div>

        <section class="game rps-game" data-game="rps" aria-busy="true">
          <div class="player-card">
            <span class="avatar" aria-hidden="true">🤖</span>
            <div class="player-meta"><p class="player-name">对手</p><p class="player-state">等待出拳</p></div>
            <span class="score">0</span>
          </div>

          <div class="arena interactive">
            <div class="versus" aria-hidden="true">VS</div>
            <p class="round-note">三局两胜 · 第 1 局</p>
          </div>

          <div class="choices interactive" role="group" aria-label="选择出拳">
            <button class="choice" type="button"><strong>✊</strong>石头</button>
            <button class="choice" type="button"><strong>✌️</strong>剪刀</button>
            <button class="choice" type="button"><strong>✋</strong>布</button>
          </div>

          <div class="player-card">
            <span class="avatar" aria-hidden="true">🤠</span>
            <div class="player-meta"><p class="player-name">你</p><p class="player-state">请选择出拳</p></div>
            <span class="score">0</span>
          </div>
        </section>

        <section class="game gomoku-game hidden-game" data-game="gomoku" aria-busy="true">
          <div class="turn-card">
            <div><p class="turn-label">当前回合</p><p class="turn-player">白方 · 对手</p></div>
            <span class="stone" aria-hidden="true"></span>
          </div>
          <div class="board-wrap interactive">
            <div class="board" role="grid" aria-label="九乘九五子棋盘"></div>
          </div>
          <p class="board-note">棋盘始终可见；同步完成前暂停落子</p>
        </section>
      </article>
    </section>
  </main>

  <script>
    const phone = document.querySelector('.phone');
    const title = document.querySelector('.app-title');
    const statusBar = document.querySelector('.status-bar');
    const statusText = document.querySelector('.status-text');
    const gamePanels = [...document.querySelectorAll('[data-game]')];
    const stateCopy = {
      connecting: '连接中…',
      syncing: '同步中…',
      reconnecting: '重连中…',
      failed: '连接失败'
    };
    const gameTitles = { rps: '石头剪刀布', gomoku: '五子棋' };

    function setGame(game) {
      title.textContent = gameTitles[game];
      gamePanels.forEach((panel) => panel.classList.toggle('hidden-game', panel.dataset.game !== game));
    }

    function setState(state) {
      const ready = state === 'ready';
      phone.dataset.state = state;
      statusBar.hidden = ready;
      if (!ready) statusText.textContent = stateCopy[state];
      gamePanels.forEach((panel) => panel.setAttribute('aria-busy', String(!ready)));
    }

    document.querySelectorAll('input[name="game"]').forEach((input) => {
      input.addEventListener('change', () => setGame(input.value));
    });

    document.querySelectorAll('input[name="state"]').forEach((input) => {
      input.addEventListener('change', () => setState(input.value));
    });

    const board = document.querySelector('.board');
    for (let index = 0; index < 81; index += 1) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('aria-label', `棋盘位置 ${Math.floor(index / 9) + 1}, ${index % 9 + 1}`);
      board.append(cell);
    }
  </script>
</body>
</html>
